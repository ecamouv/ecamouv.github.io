<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Enrique Camou Villa — Portfolio</title>
<link rel="stylesheet" href="style.css" media="all"/>
<style>
  /* Landing page — extends the tokens defined in style.css */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 8rem 2rem 4rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .identity {
    margin-bottom: 4rem;
    animation: rise 0.6s var(--ease) both;
  }

  .name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.6rem, 7vw, 4.6rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 0.98;
    color: var(--ink);
    margin-top: 0.6rem;
  }

  .tagline {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--mute);
    margin-top: 0.75rem;
    letter-spacing: 0.05em;
  }

  .doors-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.25rem;
    animation: rise 0.6s var(--ease) both;
    animation-delay: 0.1s;
  }

  .portal-door {
    background: var(--surface-card);
    border: 1px solid var(--hairline);
    padding: 2.75rem 2.25rem;
    border-radius: var(--r-md);
    text-decoration: none;
    color: var(--body);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 280px;
    transition: background 0.4s var(--ease),
                color 0.4s var(--ease),
                border-color 0.4s var(--ease),
                transform 0.4s var(--ease);
  }

  .portal-door:hover,
  .portal-door:focus-visible {
    background: var(--surface-dark);
    border-color: var(--surface-dark);
    color: var(--on-dark-mute);
    transform: translateY(-4px);
  }

  .door-number {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--mute);
    letter-spacing: 0.1em;
    display: block;
    margin-bottom: 2rem;
    transition: color 0.4s var(--ease);
  }

  .portal-door:hover .door-number {
    color: var(--on-dark-mute);
  }

  .door-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(1.7rem, 3.4vw, 2.4rem);
    line-height: 1.12;
    color: var(--ink);
    font-weight: 700;
    letter-spacing: -0.015em;
    transition: color 0.4s var(--ease);
  }

  .portal-door:hover .door-title {
    color: var(--on-dark);
  }

  .door-sub {
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--mute);
    margin-top: 0.6rem;
    letter-spacing: 0.02em;
    transition: color 0.4s var(--ease);
  }

  .portal-door:hover .door-sub {
    color: var(--on-dark-mute);
  }

  .door-enter {
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--mute);
    margin-top: 4rem;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 0.3s;
  }

  .portal-door:hover .door-enter {
    color: var(--on-dark);
  }

  .door-enter span {
    transition: transform 0.3s var(--ease);
  }

  .portal-door:hover .door-enter span {
    transform: translateX(5px);
  }

  @media (max-width: 768px) {
    main { padding: 6.5rem 1.25rem 3rem; }
    .doors-container { grid-template-columns: 1fr; gap: 1rem; }
    .portal-door { min-height: 220px; padding: 2rem; }
  }
</style>
</head>
<body>

<main>
  <div class="identity">
    <div class="page-label">Portfolio</div>
    <h1 class="name">Enrique Camou Villa</h1>
  </div>

  <div class="doors-container">
    <a href="video-portfolio.html" class="portal-door">
      <div>
        <span class="door-number">01 &mdash;&mdash;&mdash;&mdash;</span>
        <div class="door-title">Video &amp;<br>Photography</div>
        <div class="door-sub">Creative Content Portfolio</div>
      </div>
      <div class="door-enter">See Portfolio <span>&#x2192;</span></div>
    </a>
    <!--
    <a href="code-portfolio.html" class="portal-door">
      <div>
        <span class="door-number">02 &mdash;&mdash;&mdash;&mdash;</span>
        <div class="door-title">Coding &amp;<br>Development</div>
        <div class="door-sub">Full Stack &middot; Frontend Systems</div>
      </div>
      <div class="door-enter">See Portfolio <span>&#x2192;</span></div>
    </a>
    -->
  </div>
</main>

<footer>
  <span>&copy; 2026 Enrique Camou Villa</span>
  <a href="contact.html">Contact</a>
</footer>

</body>
</html>
