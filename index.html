<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Enrique Camou Villa — Portfolio</title>
<link rel="stylesheet" href="style.css" media="all"/>
<style>
  /* Landing page architecture extending style.css variables */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 9rem 2rem 4rem;
    min-height: calc(100vh - 80px);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .identity {
    margin-bottom: 4.5rem;
    animation: up 0.8s ease both;
  }
  .name {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: clamp(2.8rem, 6.5vw, 4.8rem);
    font-weight: 400;
    line-height: 1.05;
    color: var(--ash);
    margin-top: 0.5rem;
  }
  .tagline {
    font-size: 0.75rem;
    color: var(--smoke);
    margin-top: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .doors-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.5rem;
    animation: up 0.8s ease both;
    animation-delay: 0.15s;
  }
  .portal-door {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 3rem 2.5rem;
    border-radius: 4px;
    text-decoration: none;
    color: var(--ash);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 300px;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                border-color 0.3s, 
                box-shadow 0.4s;
    position: relative;
    overflow: hidden;
  }
  .portal-door::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 100% 100%, rgba(241,2,34,0.08) 0%, transparent 65%);
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .portal-door:hover {
    transform: translateY(-5px);
    border-color: var(--border2);
    box-shadow: 0 16px 36px rgba(0,0,0,0.6);
  }
  .portal-door:hover::after {
    opacity: 1;
  }
  .door-number {
    font-size: 0.7rem;
    color: var(--red);
    letter-spacing: 0.12em;
    display: block;
    margin-bottom: 2rem;
  }
  .door-title {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: clamp(1.8rem, 3.2vw, 2.6rem);
    line-height: 1.1;
    color: var(--ash);
    font-weight: 400;
  }
  .door-sub {
    font-size: 0.72rem;
    color: var(--smoke);
    margin-top: 0.6rem;
    font-family: 'DM Mono', monospace;
  }
  .door-enter {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--dim);
    margin-top: 4rem;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 0.2s;
  }
  .portal-door:hover .door-enter {
    color: var(--ash);
  }
  .door-enter span {
    transition: transform 0.2s;
  }
  .portal-door:hover .door-enter span {
    transform: translateX(5px);
  }

  @media (max-width: 768px) {
    main { padding-top: 6rem; }
    .doors-container { grid-template-columns: 1fr; gap: 1rem; }
    .portal-door { min-height: 220px; padding: 2rem; }
  }
</style>
</head>
<body>

<main>
  <div class="identity">
    <div class="page-label">Portfolio</div>
    <h1 class="name">Enrique Camou Villa</h1>
    <p class="tagline">Select a pathway to explore recent works</p>
  </div>
  
  <div class="doors-container">
    <a href="video-portfolio.html" class="portal-door">
      <div>
        <span class="door-number">01 &mdash;&mdash;&mdash;&mdash;</span>
        <div class="door-title">Video &amp;<br>Photography</div>
        <div class="door-sub">Creative Content Portfolio</div>
      </div>
      <div class="door-enter">See Portfolio <span>&#x2192;</span></div>
    </a>

    <a href="code-portfolio.html" class="portal-door">
      <div>
        <span class="door-number">02 &mdash;&mdash;&mdash;&mdash;</span>
        <div class="door-title">Coding &amp;<br>Development</div>
        <div class="door-sub">Full Stack &middot; Frontend Systems</div>
      </div>
      <div class="door-enter">See Portfolio <span>&#x2192;</span></div>
    </a>
  </div>
</main>

<footer>
  <span>&copy; 2026 Enrique Camou Villa</span>
  <a href="contact.html">Contact</a>
</footer>

</body>
</html>
